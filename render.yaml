services:
  - type: web
    name: ai-phone-line
    runtime: node
    plan: free
    buildCommand: echo no build
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: YEMOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BYPASS_PASSWORD
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: MAX_WORDS
        value: "200"
